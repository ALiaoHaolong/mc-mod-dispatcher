plugins {
    id 'com.gradle.plugin-publish' version '2.2.1'
}

group = "io.github.aliaohaolong"
version = "2.0.0"

repositories {
    mavenCentral()
    maven {
        url = "https://jitpack.io"
    }
}

dependencies {
    compileOnly gradleApi()
    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'com.github.masecla22:Modrinth4J:da95ff1'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

// 由于 ModrinthApiFactory#userAgent 中使用了 getImplementationVersion 来获取版本号
// 所以在 jar 包的 manifest 中添加 Implementation-Version 属性
tasks.named('jar') {
    manifest {
        attributes(
                'Implementation-Title': project.name,
                'Implementation-Version': project.version
        )
    }
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.jFlags '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'
    options.tags = [
            'apiNote:a:API Note:',
            'implSpec:a:Implementation Requirements:',
            'implNote:a:Implementation Note:'
    ]
}

gradlePlugin {
    website = 'https://github.com/ALiaoHaolong/mc-mod-dispatcher' // 项目网站
    vcsUrl = 'https://github.com/ALiaoHaolong/mc-mod-dispatcher' // 项目仓库

    plugins {
        register("mcModDispatcherPlugin") {
            id = 'io.github.aliaohaolong.mc-mod-dispatcher' // 插件的唯一 ID
            displayName = 'Mc Mod Dispatcher' // 可读的插件名
            description = 'A Gradle plugin for publishing Minecraft mods to Modrinth. Configure once, publish to every Minecraft version you support — no mod dev toolchain required.' // 描述
            tags.set(['minecraft', 'modrinth', 'publish', 'mod']) // 标签
            implementationClass = 'io.github.aliaohaolong.mcmoddispatcher.McModDispatcherPlugin' // 插件入口类的全限定名

            compatibility {
                features {
                    configurationCache = true
                    isolatedProjects = false
                }
            }
        }
    }
}
